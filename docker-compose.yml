services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: sales
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./queries:/queries:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U analytics -d sales && [ "$$(psql -U analytics -d sales -tAc 'SELECT count(*) FROM orders')" = "500" ]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 5s
